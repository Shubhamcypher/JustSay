<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>JustSay</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Inter, system-ui, sans-serif;
    }

    #root {
      width: 100%;
      height: 100%;
    }

    #boot-screen {
      position: fixed;
      inset: 0;
      background: #0f1117;

      display: flex;
      align-items: center;
      justify-content: center;

      z-index: 999999;

      transition:
        opacity .35s ease,
        visibility .35s ease;
    }

    #boot-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .boot-logo {
      width: 56px;
      height: 56px;

      border-radius: 16px;

      background: linear-gradient(
        135deg,
        #7c3aed,
        #8b5cf6
      );

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 22px;
      font-weight: bold;
    }

    .boot-title {
      color: white;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: .4px;
    }

    .boot-subtitle {
      color: rgba(255,255,255,.65);
      font-size: 14px;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border: 3px solid rgba(255,255,255,.15);
      border-top-color: #8b5cf6;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

<div id="boot-screen">
  <div class="boot-content">

    <div class="boot-logo">
      J
    </div>

    <div class="boot-title">
      JustSay
    </div>

    <div class="boot-subtitle">
      Loading Dashboard...
    </div>

    <div class="spinner"></div>

  </div>
</div>

<div id="root"></div>

<script type="module" src="/src/main.tsx"></script>

</body>
</html>
